# =============================================================
# Mosquitto MQTT Broker Configuration
# Water Quality Monitor — AWS EC2 Deployment
# =============================================================
# Place this file at /etc/mosquitto/conf.d/waterquality.conf
# on your EC2 instance.
# =============================================================

# --- Listener ---
# Port 1883 for unencrypted MQTT (ESP32 4G connections)
listener 1883 0.0.0.0


# --- Authentication ---
# For initial testing, allow anonymous connections.
# For production, set to false and create a password file:
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd wqm_device
#   Then uncomment the lines below:
allow_anonymous true
# password_file /etc/mosquitto/passwd

# --- Persistence ---
persistence false
# persistence_location /var/lib/mosquitto/

# --- Logging ---
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Performance ---
max_inflight_messages 20
max_queued_messages 1000
max_packet_size 8192


